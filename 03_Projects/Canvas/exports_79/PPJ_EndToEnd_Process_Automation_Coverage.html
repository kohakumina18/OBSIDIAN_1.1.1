const canvasData = {"nodes":[{"id":"lane-commercial","type":"group","x":0,"y":-260,"width":7800,"height":580,"color":"2","label":"LANE 1 - COMMERCIAL / MER / CUSTOMER"},{"id":"lane-material","type":"group","x":0,"y":560,"width":7800,"height":540,"color":"3","label":"LANE 2 - CREATIVE / FABRIC / TECHNICAL / SOURCING / PURCHASING"},{"id":"lane-finance-ai","type":"group","x":0,"y":1840,"width":7800,"height":520,"color":"6","label":"LANE 4 - FINANCE / AI PLATFORM / REPORTING"},{"id":"lane-factory","type":"group","x":0,"y":1280,"width":7800,"height":360,"color":"4","label":"LANE 3 - FACTORY / WASH / QC / SHIPPING"},{"id":"5c72ef84bb65aa75","type":"file","file":"Pasted image 20260715135638.png","x":-2840,"y":-290,"width":1700,"height":960},{"id":"title","type":"text","text":"PPJ End-to-End Process and Automation Coverage\nSales pitching -> shipping -> finance reporting\nHighlighted: automation, LLM support, data repositories, workflow gaps","x":0,"y":-520,"width":2600,"height":150,"color":"1"},{"id":"s01-sales","type":"text","text":"# 1. **Sales Pitch / Market Understanding**\nPurpose: identify opportunity, trend, target price, customer direction.\nCoverage: AI-assisted intelligence\n[[E-commerce Market Intelligence v.2.3]]\n> Canonical: **MER.MARKET.INTELLIGENCE.v1.2**","x":40,"y":-90,"width":460,"height":220,"color":"3"},{"id":"s03-cpd","type":"text","text":"# 3. Creative Product Design / 3D Visual Library\nPre-costing design reference, image search, sample library.\nCoverage: data repository / search\n> **[[CPD.Datamart.v1.1]]**\nOutput: design/style reference for costing.","x":70,"y":670,"width":430,"height":255,"color":"3"},{"id":"gap-intake","type":"text","text":"WHITE SPACE 1\nCustomer Request Intake Agent\nNormalize RFQ, techpack, image, target price, timeline, missing info.","x":40,"y":2370,"width":430,"height":150,"color":"1"},{"id":"s06-inputs","type":"text","text":"# 6. SEW / Consumption / Denim-only Wash Inputs\nSEW: construction, manpower, SMV/SAM if availab g]]","x":5880,"y":1360,"width":450,"height":200,"color":"5"},{"id":"s15-wash","type":"text","text":"# 15. Wash / R&D Wash / Operational Wash\nSampling request/trial/result/approval/history and operational wash output/delay/rework.\nCoverage: workflow portal / operational data\n> **[[WASH.SAMPLING.MANAGEMENT.PORTAL.v1.1]]**\n> **[[PROD.COWASH]]**","x":5080,"y":1340,"width":540,"height":250,"color":"3"},{"id":"s19-finance","type":"text","text":"# 19. Finance / Accounting / Reporting / Management Insight\nERP, WFX, DWH, invoice, GRN, costing plan, sales efficiency, profitability.\nCoverage: AI-assisted analytics / automation\n> **[[FIN.AI.FINANCE.MANAGEMENT.v1.1]]**\n> **[[ACC.GRN-SupplierInvoiceBot.v2.3]]**\n> **[[PPJ. Expense-Invoices.v1.1]]**\n> **[[PPJ.Invoice Downloader.v1.2]]**","x":7200,"y":1960,"width":500,"height":280,"color":"5"},{"id":"gap-shipping","type":"text","text":"WHITE SPACE 3\nShipping Readiness Dashboard\nPO, QC pass, packing, carton, document and invoice readiness.","x":7880,"y":1840,"width":450,"height":150,"color":"1"},{"id":"gap-variance","type":"text","text":"WHITE SPACE 4\nCosting Actual Variance Engine\nCompare quote assumptions vs actual consumption, SEW, wash, production efficiency and rework.","x":6800,"y":2480,"width":500,"height":170,"color":"1"},{"id":"s02-request","type":"text","text":"# 2. Customer Request / RFQ\nInputs: email, RFQ, techpack, sample image, target price, timeline.\nCoverage: partly AI-assisted, mostly manual\n\nGap: intake normalization agent.","x":880,"y":-200,"width":430,"height":220,"color":"1"},{"id":"s07-costing","type":"text","text":"# 7. Costing / Quotation\nAgentic costing uses upstream inputs:\nCPD + FD + TD + SEW + Consumption + Denim-only Wash.\nCoverage: LLM-assisted / agentic decision support\n> **[[PPJ.COSTING.AGENT.PLATFORM.v1.1]]**","x":1820,"y":-105,"width":470,"height":250,"color":"5"},{"id":"s14-production","type":"text","text":"# 14. Production Execution / Cut /  Sewing Line\nTrack output, target, downtime, efficiency and operational progress.\nCoverage: IoT / dashboard\n> **[[PROD.IOT.CHuyenTreo_1]]**\n---CUT - AUTOMATION","x":4320,"y":1370,"width":540,"height":200,"color":"5"},{"id":"s04-fd","type":"text","text":"# 4. Fabric \nFabric identity, hanger, QR, fabric visibility and material reference.\n**Coverage: Directus repository / QR**\n> **[[FD.Datamart.v2.2]]**\nOutput: fabric/material reference for costing.","x":785,"y":670,"width":430,"height":255,"color":"3"},{"id":"s05-td","type":"text","text":"# 5. Technical Knowledge / BOM / Pattern / Construction\nBOM, pattern, measurement, sewing method, technical docs.\nCoverage: knowledge platform / possible RAG\n> **[[TD.TechnicalPlatform_v2.1]]**\nOutput: technical feasibility for costing.","x":1360,"y":645,"width":480,"height":280,"color":"3"},{"id":"s18-exim","type":"text","text":"# 18. EXIM / Shipping Documents / Expense Invoice\nShipping docs, service invoices, department/factory/ledger mapping.\nCoverage: automation utility / EXIM-first processing\n> **[[PPJ. Expense-Invoices.v1.1]]**\n> **[[PPJ.Invoice Downloader.v1.2]]**","x":6420,"y":1990,"width":450,"height":230,"color":"3"}],"edges":[{"id":"e01","toFloating":false,"fromNode":"s01-sales","fromSide":"right","toNode":"s02-request","toSide":"left","label":"opportunity -> RFQ"},{"id":"e02","fromNode":"s02-request","fromSide":"bottom","toNode":"s03-cpd","toSide":"top","color":"1","label":"design reference"},{"id":"e03","fromNode":"s02-request","fromSide":"bottom","toNode":"s04-fd","toSide":"top","label":"fabric expectation"},{"id":"e04","fromNode":"s02-request","fromSide":"bottom","toNode":"s05-td","toSide":"top","label":"techpack / BOM"},{"id":"e05","fromNode":"s03-cpd","fromSide":"right","toNode":"s07-costing","toSide":"left","label":"visual input"},{"id":"e06","fromNode":"s04-fd","fromSide":"right","toNode":"s07-costing","toSide":"left","label":"fabric input"},{"id":"e07","fromNode":"s05-td","fromSide":"right","toNode":"s07-costing","toSide":"left","label":"technical input"},{"id":"e08","fromNode":"s06-inputs","fromSide":"top","toNode":"s07-costing","toSide":"bottom","label":"SEW / consumption / wash"},{"id":"e09","fromNode":"s07-costing","fromSide":"right","toNode":"s08-quote-review","toSide":"left","label":"quote recommendation"},{"id":"e10","fromNode":"s08-quote-review","fromSide":"right","toNode":"s09-po","toSide":"left","label":"accepted quote"},{"id":"e11","fromNode":"s09-po","fromSide":"bottom","toNode":"s10-sourcing","toSide":"top","label":"material need"},{"id":"e12","fromNode":"s10-sourcing","fromSide":"right","toNode":"s11-purchasing","toSide":"left","label":"supplier/material decision"},{"id":"e13","fromNode":"s11-purchasing","fromSide":"right","toNode":"s12-grn","toSide":"left","label":"received material / GRN"},{"id":"e14","fromNode":"s12-grn","fromSide":"bottom","toNode":"s13-planning","toSide":"top","label":"material readiness"},{"id":"e15","fromNode":"s13-planning","fromSide":"right","toNode":"s14-production","toSide":"left","label":"line execution"},{"id":"e16","fromNode":"s14-production","fromSide":"right","toNode":"s15-wash","toSide":"left","label":"wash if required"},{"id":"e17","fromNode":"s15-wash","fromSide":"right","toNode":"s16-qc","toSide":"left","label":"quality check"},{"id":"e18","fromNode":"s16-qc","fromSide":"right","toNode":"s17-shipping","toSide":"left","label":"QC pass"},{"id":"e19","fromNode":"s17-shipping","fromSide":"bottom","toNode":"s18-exim","toSide":"top","label":"shipping docs / expense"},{"id":"e20","fromNode":"s18-exim","fromSide":"right","toNode":"s19-finance","toSide":"left","label":"invoice / reporting"},{"id":"e21","toFloating":false,"fromNode":"s20-ai-platform","fromSide":"top","toNode":"s02-request","toSide":"bottom","label":"document Q&A potential"},{"id":"e22","fromNode":"s20-ai-platform","fromSide":"top","toNode":"s07-costing","toSide":"bottom","label":"agent orchestration"},{"id":"e23","fromNode":"s20-ai-platform","fromSide":"top","toNode":"s10-sourcing","toSide":"bottom","label":"approved search"},{"id":"e24","fromNode":"s19-finance","fromSide":"bottom","toNode":"gap-variance","toSide":"top","label":"actual vs quote feedback"},{"id":"e25","fromNode":"s17-shipping","fromSide":"bottom","toNode":"gap-shipping","toSide":"top","label":"gap"},{"id":"e26","fromNode":"s02-request","fromSide":"bottom","toNode":"gap-intake","toSide":"top","label":"gap"},{"id":"e27","fromNode":"s07-costing","fromSide":"bottom","toNode":"gap-evidence","toSide":"top","label":"gap"},{"id":"e28","fromNode":"s09-po","fromSide":"bottom","toNode":"gap-order-twin","toSide":"top","label":"future order twin"},{"id":"e29","toFloating":false,"fromFloating":false,"styleAttributes":{"pathfindingMethod":"square"},"fromNode":"s19-finance","fromSide":"right","toNode":"gap-order-twin","toSide":"right","label":"lifecycle close loop"},{"id":"b31515c9db8e7836","fromNode":"s05-td","fromSide":"right","toNode":"s06-inputs","toSide":"left"}],"metadata":{"version":"1.0-1.0","frontmatter":{}}};
const nodeMap = {};
canvasData.nodes.forEach(n => { nodeMap[n.id] = n; });

function md(text) {
  return text
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    .replace(/_([^_\n]+)_/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    .replace(/(?<!href=")(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>')
    .replace(/^\* (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
    .replace(/<\/ul>\s*<ul>/g, '')
    .replace(/\n/g, '<br>')
    .replace(/<br>\s*(<\/?[uo]l>|<li>)/g, '$1')
    .replace(/(<\/?[uo]l>|<\/li>)\s*<br>/g, '$1');
}

const canvas = document.getElementById('canvas');

canvasData.nodes.filter(n => n.type === 'group').forEach(n => {
  const div = document.createElement('div');
  div.className = 'node node-group';
  if (n.color && n.color.startsWith('#')) { div.style.borderColor = n.color; }
  div.style.left = (n.x + OX) + 'px';
  div.style.top = (n.y + OY) + 'px';
  div.style.width = n.width + 'px';
  div.style.height = n.height + 'px';
  if (n.label) { const lbl = document.createElement('span'); lbl.className = 'group-label'; lbl.textContent = n.label; div.appendChild(lbl); }
  canvas.appendChild(div);
});

canvasData.nodes.filter(n => n.type !== 'group').forEach(n => {
  const div = document.createElement('div');
  const isHex = n.color && n.color.startsWith('#');
  div.className = 'node node-text' + (n.color && !isHex ? ' color-' + n.color : '');
  if (isHex) { div.style.borderColor = n.color; }
  div.style.left = (n.x + OX) + 'px';
  div.style.top = (n.y + OY) + 'px';
  div.style.width = n.width + 'px';
  div.style.height = n.height + 'px';
  if (n.type === 'text') {
    div.innerHTML = md(n.text);
  } else if (n.type === 'file') {
    const fname = n.file.split('/').pop();
    div.innerHTML = '\ud83d\udcc4 ' + fname + (n.subpath ? ' ' + n.subpath : '');
  } else if (n.type === 'link') {
    div.innerHTML = '<div style="font-size:10px;opacity:0.5;margin-bottom:2px">[embedded URL]</div>' +
      '<a href="' + n.url + '" target="_blank">' + n.url + '</a>';
  }
  canvas.appendChild(div);
});

const svg = document.getElementById('edges');
canvasData.edges.forEach(e => {
  const from = nodeMap[e.fromNode];
  const to = nodeMap[e.toNode];
  if (!from || !to) return;
  function anchor(node, side) {
    const x = node.x + OX, y = node.y + OY;
    switch(side) {
      case 'top': return {x: x+node.width/2, y};
      case 'bottom': return {x: x+node.width/2, y: y+node.height};
      case 'left': return {x, y: y+node.height/2};
      case 'right': return {x: x+node.width, y: y+node.height/2};
      default: return {x: x+node.width/2, y: y+node.height/2};
    }
  }
  const p1 = anchor(from, e.fromSide);
  const p2 = anchor(to, e.toSide);
  let cp1, cp2;
  if (e.fromSide === 'bottom' && e.toSide === 'top') {
    const off = Math.min(Math.abs(p2.y-p1.y)*0.5, 60);
    cp1 = {x:p1.x, y:p1.y+off}; cp2 = {x:p2.x, y:p2.y-off};
  } else if (e.fromSide === 'right' && e.toSide === 'left') {
    const off = Math.min(Math.abs(p2.x-p1.x)*0.4, 80);
    cp1 = {x:p1.x+off, y:p1.y}; cp2 = {x:p2.x-off, y:p2.y};
  } else {
    const dx=p2.x-p1.x, dy=p2.y-p1.y;
    cp1 = {x:p1.x+dx*0.3, y:p1.y+dy*0.3}; cp2 = {x:p1.x+dx*0.7, y:p1.y+dy*0.7};
  }
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d','M '+p1.x+' '+p1.y+' C '+cp1.x+' '+cp1.y+', '+cp2.x+' '+cp2.y+', '+p2.x+' '+p2.y);
  path.setAttribute('stroke','#667');
  path.setAttribute('stroke-width','1.5');
  path.setAttribute('fill','none');
  path.setAttribute('opacity','0.6');
  const angle = Math.atan2(p2.y-cp2.y, p2.x-cp2.x);
  const al=8;
  const arrow = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  arrow.setAttribute('points', p2.x+','+p2.y+' '+(p2.x-al*Math.cos(angle-0.4))+','+(p2.y-al*Math.sin(angle-0.4))+' '+(p2.x-al*Math.cos(angle+0.4))+','+(p2.y-al*Math.sin(angle+0.4)));
  arrow.setAttribute('fill','#667');
  arrow.setAttribute('opacity','0.6');
  svg.appendChild(path);
  svg.appendChild(arrow);
});
</script>
